packages:
  - apps/*
  - packages/*

# 全アプリで共通にするバージョン。React は Expo SDK が要求する版に合わせる
# (Web と スマホで React が二重に入ると動かなくなるため)。
# Expo SDK を上げるときは、ここもまとめて更新する。
catalog:
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': ~19.3.0
  '@types/react-dom': ~19.3.0
  typescript: ~6.0.3
  vite: ^8.3.5
  '@vitejs/plugin-react': ^6.1.2
